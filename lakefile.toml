name = "weighted-chains"
version = "0.1.0"
defaultTargets = ["WeightedChains", "WeightedChainsPalomar"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.1"

# The formalisation proper.
[[lean_lib]]
name = "WeightedChains"
moreLeanArgs = ["-DwarningAsError=true"]

# Palomar Challenge/Solution record, checked by `leanprover/comparator`
# following `comparator.json`.  `Challenge` imports only Mathlib and
# deliberately leaves every proof as `sorry`, which is why sorry warnings are
# switched off for this library only; `Solution` proves the same statements
# from the `WeightedChains` library.
[[lean_lib]]
name = "WeightedChainsPalomar"
roots = ["WeightedChainsPalomar.Challenge", "WeightedChainsPalomar.Solution"]
moreLeanArgs = ["-DwarningAsError=true", "-Dwarn.sorry=false"]
