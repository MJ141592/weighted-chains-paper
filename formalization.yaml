# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "A generalisation of Sperner's theorem using weighted chain decomposition"
  description: >-
    A Lean 4 formalization of the paper of the same name (arXiv:2509.26493). Call
    a family A of vertices of the cube {0, ..., d}^n k-separated if any two
    distinct comparable members x <= y of A differ on more than k coordinates.
    The main theorem states that for 1 < k <= n and d in {1, 2}, the largest
    k-separated families are exactly A_1 and A_2, the families of vertices whose
    rank (coordinate sum) is congruent to floor(nd/2), respectively
    ceil(nd/2), modulo dk + 1; the two coincide when nd is even. The proof
    decomposes the cube into weighted chains, invariant under coordinate
    permutation, and double counts against the weights; the same method gives
    a new proof of Sperner's theorem (the case d = 1, k = n), carried out in an
    appendix. The formalization also proves that A_1 and A_2 are k-separated
    and equally large for every d, that both are largest for every d in the
    range n/2 <= k <= n via a symmetric chain decomposition (also for cuboids
    {0, ..., d_1} x ... x {0, ..., d_n}), Sperner's theorem with its equality
    case, and that the maximal density of a k-separated family in
    {0, ..., d}^n tends to 1/(dk + 1) as n tends to infinity for every fixed
    d, k >= 1. These seven results are the compared theorems of the Palomar
    record in WeightedChainsPalomar/. The compared theorems depend on propext,
    Classical.choice and Quot.sound and on nothing else, and there is no sorry
    outside the seven deliberate holes in WeightedChainsPalomar/Challenge.lean.
  authors:
    - "Matthew Johnson"
    - "Yaël Dillies"
    - "Aleksandra Kowalska"
  responsible_maintainers:
    - "Matthew Johnson"
  license: "Apache-2.0"

repository:
  role: substantive-development

classification:
  arxiv: [math.CO]
  msc2020: ["05D05", "06A07"]

status:
  scope: >-
    Complete, with no unproved step, for each of the seven compared theorems
    and for the whole development in WeightedChains/. Every numbered
    environment of the paper, the asymptotic conclusion, both appendix results
    and the appendix's closing remark on cuboids have a Lean counterpart;
    FORMALIZATION.md carries the item-by-item map and the interactive blueprint
    under blueprint/ links each paper statement to its declaration. The only
    headline-level library result without a compared counterpart is the de
    Bruijn-Tengbergen-Kruyswijk theorem (LargeK.deBruijnTengbergenKruyswijk),
    the existence of a symmetric chain decomposition of every finite cuboid,
    which is proved constructively as the tool for the large-k appendix; its
    statement is about a project-defined structure (RankedSCD) and so cannot
    be phrased in a Mathlib-only Challenge module. Its consequences are
    compared.
  # The proof development contains no sorry. The only seven in the repository
  # are the deliberate placeholders in WeightedChainsPalomar/Challenge.lean,
  # which these counts exclude by convention.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "WeightedChains.main_theorem"
      file: "WeightedChainsPalomar/Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "WeightedChains.residue_families_kSeparated"
      file: "WeightedChainsPalomar/Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "WeightedChains.residue_families_card_eq"
      file: "WeightedChainsPalomar/Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "WeightedChains.large_k_bound"
      file: "WeightedChainsPalomar/Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "WeightedChains.cuboid_large_k_bound"
      file: "WeightedChainsPalomar/Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
